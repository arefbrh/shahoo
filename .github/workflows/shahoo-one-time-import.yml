name: SHAHOO one-time audited candidate import

on:
  push:
    branches:
      - feat/self-hosted-infra-remediation
    paths:
      - '.transfer/SHAHOO_CANDIDATE_DELTA_90_FILES_20261125.tar.gz'

permissions:
  contents: write

concurrency:
  group: shahoo-one-time-candidate-import
  cancel-in-progress: false

jobs:
  import:
    name: Import audited candidate onto feature branch
    if: github.repository == 'shahoo-workspace/shahoo' && github.ref == 'refs/heads/feat/self-hosted-infra-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify transfer archive and strictly validate members
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/self-hosted-infra-remediation"
          echo "f1d5747ddbe5b633def9429cba764f8846d4d6706d65d641ff4ddca97aeb347d  .transfer/SHAHOO_CANDIDATE_DELTA_90_FILES_20261125.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import tarfile, pathlib
          path = '.transfer/SHAHOO_CANDIDATE_DELTA_90_FILES_20261125.tar.gz'
          with tarfile.open(path, 'r:gz') as tf:
              members = tf.getmembers()
              assert len(members) == 90, f'Expected 90 files, got {len(members)}'
              for m in members:
                  p = pathlib.PurePosixPath(m.name)
                  assert m.isfile() and not p.is_absolute() and '..' not in p.parts and m.name != '.'
              print('Verified 90 safe regular-file entries')
          PY
      - name: Unpack, commit, and push only feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/self-hosted-infra-remediation"
          tar -xzf .transfer/SHAHOO_CANDIDATE_DELTA_90_FILES_20261125.tar.gz -C .
          rm -f .transfer/SHAHOO_CANDIDATE_DELTA_90_FILES_20261125.tar.gz
          rmdir .transfer
          git add -A
          git diff --cached --quiet && { echo 'No candidate changes found'; exit 1; }
          git -c user.name='shahoo-integration-bot' -c user.email='actions@users.noreply.github.com' commit -m "feat(self-host): integrate 90 candidate source changes from audited archive"
          git push origin HEAD:refs/heads/feat/self-hosted-infra-remediation
