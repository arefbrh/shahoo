name: SHAHOO one-time router codegen sync

on:
  push:
    branches:
      - feat/self-hosted-infra-remediation
    paths:
      - 'src/server/cms/content.ts'

permissions:
  contents: write

jobs:
  sync:
    name: Regenerate checked-in TanStack route tree
    if: github.repository == 'shahoo-workspace/shahoo' && github.ref == 'refs/heads/feat/self-hosted-infra-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Regenerate routes through the real build
        run: npm run build
      - name: Commit generated route tree on feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/self-hosted-infra-remediation"
          git add src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo 'Route tree already up to date.'
            exit 0
          fi
          git -c user.name='shahoo-integration-bot' -c user.email='actions@users.noreply.github.com' commit -m "fix(router): register API health route in generated TanStack route tree"
          git push origin HEAD:refs/heads/feat/self-hosted-infra-remediation
